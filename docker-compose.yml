services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drivematch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
      POSTGRES_DB: drivematch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U drivematch']
      interval: 5s
      timeout: 5s
      retries: 10
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://drivematch:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/drivematch
    command: [python, -m, backend.app.import_catalog, --database]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://drivematch:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/drivematch
    ports: ['127.0.0.1:8100:8000']
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health")']
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_URL: http://backend:8000
    ports: ['127.0.0.1:3100:3000']
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
